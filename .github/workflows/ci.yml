name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires (core)
        run: npm test
      - name: Build reproductible (core injecté à jour dans index.html)
        run: |
          npm run build
          git diff --exit-code index.html
      - name: Installer Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run e2e
